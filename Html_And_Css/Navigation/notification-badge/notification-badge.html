<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>notification-badge</title>
        <script
            src="https://kit.fontawesome.com/be758ed6ae.js"
            crossorigin="anonymous"
        ></script>
        <link rel="stylesheet" href="NotificationBagde.css" />
    </head>
    <body>
        <nav>
            <!-- thường nằm trong thể navigation -->
            <button class="notification-btn">
                <i class="fa-solid fa-bell" aria-hidden="true"></i>
                <span class="notification-badge" aria-hidden="true">10</span>
            </button>
        </nav>
    </body>
</html>
